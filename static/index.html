<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Claudiya</title>
<link rel="manifest" href="/static/manifest.json" />
<meta name="theme-color" content="#1a1a1a" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #17181a;
    color: #e8e6e1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid #2a2b2e;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #5fbf77;
    display: inline-block;
    margin-right: 8px;
  }
  #reset-btn {
    background: none;
    border: 1px solid #3a3b3e;
    color: #a9a7a2;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 13px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #3a4a5c;
    color: #eef2f5;
    border-bottom-right-radius: 3px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #232426;
    border: 1px solid #2c2d30;
    border-bottom-left-radius: 3px;
  }
  .msg.assistant pre {
    background: #131415;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 13px;
  }
  .msg.assistant code {
    font-family: "SF Mono", Consolas, monospace;
  }
  .msg.pending {
    opacity: 0.5;
  }
  #input-bar {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #2a2b2e;
    background: #17181a;
  }
  #input-bar textarea {
    flex: 1;
    resize: none;
    background: #232426;
    border: 1px solid #35363a;
    border-radius: 10px;
    color: #e8e6e1;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    max-height: 120px;
  }
  #input-bar button {
    background: #3a4a5c;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 500;
  }
  #input-bar button:disabled {
    opacity: 0.4;
  }
  #empty-state {
    margin: auto;
    text-align: center;
    color: #6b6a67;
    font-size: 14px;
    padding: 20px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="dot"></span>Claudiya</h1>
    <button id="reset-btn">Очистить</button>
  </header>
  <div id="messages">
    <div id="empty-state">Личный ассистент по разработке MakeApp.<br/>Напиши, с чем помочь.</div>
  </div>
  <div id="input-bar">
    <textarea id="input" rows="1" placeholder="Сообщение..."></textarea>
    <button id="send-btn">→</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const resetBtn = document.getElementById('reset-btn');
  const emptyState = document.getElementById('empty-state');

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }
  inputEl.addEventListener('input', autoResize);

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderMarkdownLite(text) {
    let escaped = escapeHtml(text);
    escaped = escaped.replace(/```([\s\S]*?)```/g, (m, code) => `<pre><code>${code}</code></pre>`);
    escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
    return escaped;
  }

  function addMessage(role, text, pending = false) {
    if (emptyState) emptyState.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + role + (pending ? ' pending' : '');
    div.innerHTML = renderMarkdownLite(text);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage('user', text);
    inputEl.value = '';
    autoResize();
    sendBtn.disabled = true;

    const pendingEl = addMessage('assistant', 'Думаю...', true);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      pendingEl.classList.remove('pending');
      pendingEl.innerHTML = renderMarkdownLite(data.answer);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } catch (err) {
      pendingEl.classList.remove('pending');
      pendingEl.textContent = 'Ошибка сети: ' + err.message;
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  resetBtn.addEventListener('click', async () => {
    if (!confirm('Очистить историю разговора?')) return;
    await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confirm: true })
    });
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
  });

  // Регистрируем service worker для PWA (офлайн-оболочка, не офлайн-чат)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js').catch(() => {});
  }
</script>
</body>
</html>
