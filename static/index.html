<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Claudia</title>
<link rel="manifest" href="/static/manifest.json" />
<meta name="theme-color" content="#1a1a1a" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #17181a;
    color: #e8e6e1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid #2a2b2e;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #5fbf77;
    display: inline-block;
    margin-right: 8px;
  }
  #reset-btn {
    background: none;
    border: 1px solid #3a3b3e;
    color: #a9a7a2;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 13px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #3a4a5c;
    color: #eef2f5;
    border-bottom-right-radius: 3px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #232426;
    border: 1px solid #2c2d30;
    border-bottom-left-radius: 3px;
  }
  .msg.assistant pre {
    background: #131415;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 13px;
  }
  .msg.assistant code {
    font-family: "SF Mono", Consolas, monospace;
  }
  .copy-btn {
    display: block;
    margin-top: 6px;
    background: none;
    border: none;
    color: #6b6a67;
    font-size: 13px;
    padding: 2px 4px;
    cursor: pointer;
  }
  .copy-btn:hover {
    color: #a9a7a2;
  }
  .msg.pending {
    opacity: 0.5;
  }
  .change-card {
    align-self: flex-start;
    max-width: 92%;
    background: #1e2b23;
    border: 1px solid #2f4436;
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
  }
  .change-card .change-path {
    font-family: "SF Mono", Consolas, monospace;
    font-weight: 600;
    margin-bottom: 6px;
    color: #9fd9b4;
  }
  .change-card .change-commit-msg {
    color: #8a8d87;
    margin-bottom: 8px;
    font-style: italic;
  }
  .change-card pre {
    background: #131415;
    padding: 8px;
    border-radius: 6px;
    overflow-x: auto;
    max-height: 240px;
    font-size: 12px;
    margin: 0 0 8px 0;
  }
  .change-card .diff-add { color: #7ee0a0; }
  .change-card .diff-remove { color: #e07e7e; text-decoration: line-through; opacity: 0.7; }
  .change-actions {
    display: flex;
    gap: 8px;
  }
  .change-actions button {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
    font-weight: 500;
  }
  .btn-apply {
    background: #3d7a54;
    color: white;
  }
  .btn-discard {
    background: #3a3b3e;
    color: #d0cec9;
  }
  .change-card.resolved {
    opacity: 0.55;
  }
  .change-card .resolved-label {
    font-size: 12px;
    color: #8a8d87;
  }
  #input-bar {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #2a2b2e;
    background: #17181a;
  }
  #input-bar textarea {
    flex: 1;
    resize: none;
    background: #232426;
    border: 1px solid #35363a;
    border-radius: 10px;
    color: #e8e6e1;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    max-height: 120px;
  }
  #input-bar button {
    background: #3a4a5c;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 500;
  }
  #input-bar button:disabled {
    opacity: 0.4;
  }
  #settings-btn {
    background: none;
    border: 1px solid #3a3b3e;
    color: #a9a7a2;
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 6px;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .modal {
    background: #1e1f21;
    border-radius: 16px 16px 0 0;
    padding: 16px;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    overflow-x: hidden;
    box-sizing: border-box;
  }
  .modal h2 {
    font-size: 16px;
    margin: 0 0 14px 0;
  }
  .provider-option {
    display: flex;
    flex-direction: column;
    padding: 12px;
    border: 1px solid #35363a;
    border-radius: 10px;
    margin-bottom: 8px;
    box-sizing: border-box;
    width: 100%;
    overflow: hidden;
  }
  .provider-option.active {
    border-color: #3d7a54;
    background: #1e2b23;
  }
  .provider-option .provider-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .provider-option .provider-label {
    font-size: 14px;
    font-weight: 500;
  }
  .provider-option .provider-model {
    font-size: 12px;
    color: #8a8d87;
    font-family: "SF Mono", Consolas, monospace;
    overflow-wrap: break-word;
  }
  .provider-option .provider-status {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .provider-status.configured {
    background: #1e2b23;
    color: #7ee0a0;
  }
  .provider-status.not-configured {
    background: #3a2b2b;
    color: #e0a07e;
  }
  .provider-header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .provider-header-row > div:last-child {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .provider-option button {
    background: #3a4a5c;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    white-space: nowrap;
  }
  .provider-option button:disabled {
    opacity: 0.3;
  }
  .api-key-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .api-key-input {
    flex: 1 1 140px;
    min-width: 0;
    background: #131415;
    border: 1px solid #35363a;
    border-radius: 6px;
    color: #e8e6e1;
    padding: 7px 9px;
    font-size: 13px;
    font-family: "SF Mono", Consolas, monospace;
  }
  .btn-save-key {
    background: #3a4a5c;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0 12px;
    font-size: 12px;
    flex-shrink: 0;
  }
  .btn-delete-key {
    background: #4a2b2b;
    color: #e0a0a0;
    border: none;
    border-radius: 6px;
    padding: 0 10px;
    font-size: 12px;
  }
  #empty-state {
    margin: auto;
    text-align: center;
    color: #6b6a67;
    font-size: 14px;
    padding: 20px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="project-switcher" style="background:none; border:none; color:inherit; display:flex; align-items:center; gap:6px; padding:0; text-align:left; min-width:0;">
      <span class="dot"></span>
      <span style="display:flex; flex-direction:column; min-width:0;">
        <span style="font-size:17px; font-weight:600;">Claudia</span>
        <span id="current-project-name" style="font-size:11px; color:#8a8d87; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Загрузка...</span>
      </span>
    </button>
    <div style="display:flex; gap:8px; flex-shrink:0;">
      <button id="github-settings-btn">🔗</button>
      <button id="settings-btn">⚙️</button>
      <button id="reset-btn">Очистить</button>
    </div>
  </header>
  <div id="messages">
    <div id="empty-state">Личный ассистент по разработке.<br/>Напиши, с чем помочь.</div>
  </div>

  <div id="settings-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2>Провайдер модели</h2>
      <div id="provider-list"></div>
      <button id="settings-close-btn" class="btn-discard" style="margin-top:12px; width:100%;">Закрыть</button>
    </div>
  </div>

  <div id="projects-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2>Проекты</h2>
      <div id="projects-list"></div>
      <div class="api-key-row" style="margin-top:12px;">
        <input type="text" id="new-project-name" class="api-key-input" placeholder="Название нового проекта..." />
        <button class="btn-save-key" id="create-project-btn">Создать</button>
      </div>
      <button id="projects-close-btn" class="btn-discard" style="margin-top:12px; width:100%;">Закрыть</button>
    </div>
  </div>

  <div id="github-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2>GitHub для этого проекта</h2>
      <p style="font-size:13px; color:#8a8d87; margin-top:-8px;">Токен и репозиторий свои у каждого проекта.</p>
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">
        <input type="text" id="github-repo-input" class="api-key-input" placeholder="owner/repo, например maks/devagent" />
        <input type="password" id="github-token-input" class="api-key-input" placeholder="GitHub Personal Access Token" />
      </div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn-save-key" id="github-save-btn" style="flex:1;">Сохранить</button>
        <button class="btn-delete-key" id="github-delete-btn">Удалить</button>
      </div>
      <div id="github-status" style="font-size:12px; color:#8a8d87; margin-top:8px;"></div>
      <button id="github-close-btn" class="btn-discard" style="margin-top:12px; width:100%;">Закрыть</button>
    </div>
  </div>

  <div id="input-bar">
    <textarea id="input" rows="1" placeholder="Сообщение..."></textarea>
    <button id="send-btn">→</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const resetBtn = document.getElementById('reset-btn');
  const emptyState = document.getElementById('empty-state');

  const settingsBtn = document.getElementById('settings-btn');
  const settingsModal = document.getElementById('settings-modal');
  const settingsCloseBtn = document.getElementById('settings-close-btn');
  const providerListEl = document.getElementById('provider-list');

  async function loadSettings() {
    try {
      const res = await fetch('/api/settings');
      const data = await res.json();
      renderProviderList(data);
    } catch (err) {
      providerListEl.innerHTML = `<p style="color:#e07e7e;">Не удалось загрузить настройки: ${escapeHtml(err.message)}</p>`;
    }
  }

  function renderProviderList(data) {
    providerListEl.innerHTML = '';
    data.providers.forEach(p => {
      const isActive = p.id === data.active_provider;
      const row = document.createElement('div');
      row.className = 'provider-option' + (isActive ? ' active' : '');

      const statusLabel = p.key_source === 'ui' ? 'ключ введён'
        : p.key_source === 'env' ? 'ключ из окружения'
        : 'нет ключа';

      row.innerHTML = `
        <div class="provider-header-row">
          <div class="provider-info">
            <span class="provider-label">${escapeHtml(p.label)}</span>
            <span class="provider-model">${escapeHtml(isActive ? data.active_model : p.default_model)}</span>
          </div>
          <div>
            <span class="provider-status ${p.configured ? 'configured' : 'not-configured'}">${statusLabel}</span>
            ${isActive ? '' : `<button class="btn-select" ${p.configured ? '' : 'disabled'}>Выбрать</button>`}
          </div>
        </div>
        <div class="api-key-row">
          <input type="password" class="api-key-input" placeholder="Вставь API-ключ..." />
          <button class="btn-save-key">Сохранить</button>
          ${p.key_source === 'ui' ? '<button class="btn-delete-key">✕</button>' : ''}
        </div>
      `;

      const selectBtn = row.querySelector('.btn-select');
      if (selectBtn) selectBtn.addEventListener('click', () => switchProvider(p.id));

      const keyInput = row.querySelector('.api-key-input');
      row.querySelector('.btn-save-key').addEventListener('click', () => saveApiKey(p.id, keyInput.value));

      const deleteBtn = row.querySelector('.btn-delete-key');
      if (deleteBtn) deleteBtn.addEventListener('click', () => deleteApiKey(p.id));

      providerListEl.appendChild(row);
    });
  }

  async function saveApiKey(providerId, apiKey) {
    if (!apiKey.trim()) {
      alert('Введи ключ перед сохранением');
      return;
    }
    try {
      const res = await fetch('/api/settings/api-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider: providerId, api_key: apiKey.trim() })
      });
      if (!res.ok) {
        const err = await res.json();
        alert('Ошибка: ' + (err.error || 'не удалось сохранить ключ'));
        return;
      }
      loadSettings();
    } catch (err) {
      alert('Ошибка сети: ' + err.message);
    }
  }

  async function deleteApiKey(providerId) {
    if (!confirm('Удалить сохранённый ключ для этого провайдера?')) return;
    try {
      await fetch('/api/settings/api-key/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider: providerId })
      });
      loadSettings();
    } catch (err) {
      alert('Ошибка сети: ' + err.message);
    }
  }

  async function switchProvider(providerId) {
    try {
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider: providerId })
      });
      if (!res.ok) {
        const err = await res.json();
        alert('Ошибка: ' + (err.error || 'не удалось переключить'));
        return;
      }
      loadSettings();
    } catch (err) {
      alert('Ошибка сети: ' + err.message);
    }
  }

  settingsBtn.addEventListener('click', () => {
    settingsModal.style.display = 'flex';
    loadSettings();
  });
  settingsCloseBtn.addEventListener('click', () => {
    settingsModal.style.display = 'none';
  });
  settingsModal.addEventListener('click', (e) => {
    if (e.target === settingsModal) settingsModal.style.display = 'none';
  });

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }
  inputEl.addEventListener('input', autoResize);

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderMarkdownLite(text) {
    let escaped = escapeHtml(text);
    escaped = escaped.replace(/```([\s\S]*?)```/g, (m, code) => `<pre><code>${code}</code></pre>`);
    escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
    return escaped;
  }

  function addMessage(role, text, pending = false) {
    if (emptyState) emptyState.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + role + (pending ? ' pending' : '');
    div.innerHTML = renderMarkdownLite(text);

    if (role === 'assistant' && !pending) {
      div.appendChild(makeCopyButton(() => div.dataset.rawText || text));
    }
    div.dataset.rawText = text;

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function makeCopyButton(getText) {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '📋';
    btn.title = 'Скопировать текст';
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        await navigator.clipboard.writeText(getText());
        btn.textContent = '✓';
        setTimeout(() => { btn.textContent = '📋'; }, 1200);
      } catch (err) {
        alert('Не удалось скопировать: ' + err.message);
      }
    });
    return btn;
  }

  function renderChangeCard(change) {
    if (emptyState) emptyState.remove();
    const card = document.createElement('div');
    card.className = 'change-card';
    card.dataset.changeId = change.change_id;

    const preview = change.new_content.length > 3000
      ? change.new_content.slice(0, 3000) + '\n... (обрезано для показа)'
      : change.new_content;

    card.innerHTML = `
      <div class="change-path">📝 ${escapeHtml(change.path)}</div>
      <div class="change-commit-msg">${escapeHtml(change.commit_message)}</div>
      <pre><code>${escapeHtml(preview)}</code></pre>
      <div class="change-actions">
        <button class="btn-apply">Применить</button>
        <button class="btn-discard">Отклонить</button>
      </div>
    `;

    card.querySelector('.btn-apply').addEventListener('click', () => resolveChange(change.change_id, card, 'apply'));
    card.querySelector('.btn-discard').addEventListener('click', () => resolveChange(change.change_id, card, 'discard'));

    messagesEl.appendChild(card);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function resolveChange(changeId, card, action) {
    const buttons = card.querySelectorAll('button');
    buttons.forEach(b => b.disabled = true);

    try {
      const res = await fetch(`/api/${action === 'apply' ? 'apply-change' : 'discard-change'}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ change_id: changeId })
      });
      const data = await res.json();

      card.classList.add('resolved');
      const actionsDiv = card.querySelector('.change-actions');
      actionsDiv.innerHTML = `<span class="resolved-label">${escapeHtml(data.result)}</span>`;
    } catch (err) {
      buttons.forEach(b => b.disabled = false);
      alert('Ошибка: ' + err.message);
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage('user', text);
    inputEl.value = '';
    autoResize();
    sendBtn.disabled = true;

    const pendingEl = addMessage('assistant', 'Думаю...', true);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      if (!res.body) throw new Error('Стриминг не поддерживается браузером');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      const toolLines = [];
      let finalAnswer = null;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // последняя строка может быть неполной — оставляем в буфере

        for (const line of lines) {
          if (!line.trim()) continue;
          const event = JSON.parse(line);

          if (event.type === 'status') {
            pendingEl.innerHTML = renderMarkdownLite(event.text);
          } else if (event.type === 'tool_call') {
            toolLines.push(event.text);
            pendingEl.innerHTML = renderMarkdownLite(toolLines.join('\n') + '\n\nДумаю...');
          } else if (event.type === 'proposed_change') {
            renderChangeCard(event.change);
          } else if (event.type === 'final') {
            finalAnswer = event.answer;
          }
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      }

      const fullText = toolLines.length > 0
        ? toolLines.join('\n') + '\n\n' + (finalAnswer || '')
        : (finalAnswer || '(пустой ответ)');

      pendingEl.classList.remove('pending');
      pendingEl.innerHTML = renderMarkdownLite(fullText);
      pendingEl.dataset.rawText = fullText;
      pendingEl.appendChild(makeCopyButton(() => pendingEl.dataset.rawText));
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } catch (err) {
      pendingEl.classList.remove('pending');
      pendingEl.textContent = 'Ошибка сети: ' + err.message;
      pendingEl.dataset.rawText = 'Ошибка сети: ' + err.message;
      pendingEl.appendChild(makeCopyButton(() => pendingEl.dataset.rawText));
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  resetBtn.addEventListener('click', async () => {
    if (!confirm('Очистить историю разговора?')) return;
    await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confirm: true })
    });
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
  });

  // Регистрируем service worker для PWA (офлайн-оболочка, не офлайн-чат)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js').catch(() => {});
  }
</script>
</body>
</html>
